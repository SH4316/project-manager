{% extends "base.html" %}{% block title %}운영 상태{% endblock %}
{% block main %}
<section class="card">
  <div class="card-head"><h1 class="t24">운영 상태</h1><a class="btn sm" href="{% url 'export_json' %}">JSON 내보내기</a></div>
  <table class="grid">
    <thead><tr><th>이름</th><th>마지막 실행</th><th>결과</th><th>상세</th></tr></thead>
    <tbody>
    {% for s in statuses %}
    <tr><td>{{ s.name }}</td><td>{{ s.last_run_at|date:"Y-m-d H:i" }}</td><td>{% if s.ok %}ok{% else %}<span class="danger">fail</span>{% endif %}</td><td class="muted t13">{{ s.detail }}</td></tr>
    {% empty %}<tr><td colspan="4" class="muted">보고된 통합 상태가 없습니다.</td></tr>{% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
