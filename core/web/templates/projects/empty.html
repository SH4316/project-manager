{% extends "base.html" %}{% block title %}프로젝트{% endblock %}
{% block main %}
<div class="card">

  <p class="muted">이 조직에는 아직 프로젝트가 없습니다.</p>
  {% if is_admin %}

  {% endif %}
</div>
{% endblock %}
