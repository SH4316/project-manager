{% extends "base.html" %}{% block title %}{{ task.number }} 수정{% endblock %}
{% block main %}
<div class="card">
  <h1 class="t24">{{ task.number }} 수정</h1>
  <form method="post" class="stack">{% csrf_token %}
    {% for e in form.non_field_errors %}<div class="error">{{ e }}</div>{% endfor %}
    {{ form.as_p }}
    <div class="row">
      <button class="btn primary">저장</button>
      <a class="btn" href="{% url 'task_detail' task.pk %}">취소</a>
    </div>
  </form>
</div>
{% endblock %}
