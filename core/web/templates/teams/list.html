{% extends "base.html" %}{% block title %}팀{% endblock %}
{% block main %}
<div class="card">
  <h1 class="t24">내 팀</h1>
  <ul class="links">
    {% for t in teams %}<li><a href="{% url 'team_detail' t.pk %}">{{ t.name }}</a> <span class="muted t13">{{ t.purpose }}</span></li>
    {% empty %}<li class="muted">아직 팀에 속해 있지 않습니다. 초대 링크가 필요합니다.</li>{% endfor %}
  </ul>
  <a class="btn" href="{% url 'team_new' %}">팀 만들기</a>
</div>
{% endblock %}
