[project]
name = "sandol-discord"
version = "0.1.0"
description = "산돌이 태스크 — Discord 알림 서비스"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
